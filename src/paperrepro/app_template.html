<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperRepro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #ece5d6; --paper: #fbf8f1; --paper-2: #f3eddf; --ink: #1d1b17; --muted: #6c6556; --faint: #a69e8d;
  --rule: rgba(29,27,23,.12); --rule-2: rgba(29,27,23,.2);
  --hi: rgba(247,207,64,.55); --hi-soft: rgba(247,207,64,.22); --hi-sel: rgba(247,180,40,.75);
  --accent: #2443a3; --ok: #2b7549; --rel: #3b6aa0; --bad: #b3412c; --card-rule: #d9514a; --card-line: rgba(70,120,200,.13);
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 30px -12px rgba(40,30,10,.25);
  --display: "Fraunces", Georgia, serif; --read: "Newsreader", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #121419; --paper: #1b1e25; --paper-2: #232731; --ink: #ebe6da; --muted: #9b9a93; --faint: #626573;
  --rule: rgba(235,230,218,.1); --rule-2: rgba(235,230,218,.18);
  --hi: rgba(222,184,46,.38); --hi-soft: rgba(222,184,46,.15); --hi-sel: rgba(232,170,40,.6);
  --accent: #8fa8ff; --ok: #6fd39a; --rel: #8db8ea; --bad: #ff8a72; --card-rule: #e2675f; --card-line: rgba(140,180,255,.08);
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  --desk: #121419; --paper: #1b1e25; --paper-2: #232731; --ink: #ebe6da; --muted: #9b9a93; --faint: #626573;
  --rule: rgba(235,230,218,.1); --rule-2: rgba(235,230,218,.18);
  --hi: rgba(222,184,46,.38); --hi-soft: rgba(222,184,46,.15); --hi-sel: rgba(232,170,40,.6);
  --accent: #8fa8ff; --ok: #6fd39a; --rel: #8db8ea; --bad: #ff8a72; --card-rule: #e2675f; --card-line: rgba(140,180,255,.08);
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: var(--read); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--desk); border-bottom: 1px solid var(--rule-2); }
.top-in { max-width: 1480px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.brand b { font-family: var(--display); font-weight: 450; font-style: italic; font-size: 23px; letter-spacing: -.01em; }
.top a.link { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: .04em; }
.top a.link:hover { color: var(--ink); }
.ghost { font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--rule-2); color: var(--muted); padding: 5px 9px; cursor: pointer; border-radius: 4px; }
.ghost:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- home ---------- */
.home { max-width: 1240px; margin: 0 auto; padding: 64px 28px 120px; }
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 64px; align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 340; font-size: clamp(42px, 6vw, 86px); line-height: .96; letter-spacing: -.03em; margin: 0; font-variation-settings: "opsz" 144; }
.hero h1 em { font-weight: 300; font-style: italic; background: linear-gradient(transparent 58%, var(--hi) 58%, var(--hi) 92%, transparent 92%); padding: 0 .06em; }
.hero p.lede { font-size: 21px; line-height: 1.55; color: var(--muted); max-width: 34ch; margin: 30px 0 0; font-weight: 340; }
.tray { position: relative; padding: 18px; }
.tray .sheet { position: absolute; inset: 18px; background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); }
.tray .sheet.s1 { transform: rotate(-4deg) translate(-10px, 8px); opacity: .55; }
.tray .sheet.s2 { transform: rotate(2.5deg) translate(8px, 4px); opacity: .8; }
.drop { position: relative; background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); padding: 46px 38px 34px; text-align: center; border: 2px dashed transparent; transition: border-color .15s, transform .2s; }
.drop.over { border-color: var(--accent); transform: rotate(-.6deg) scale(1.01); }
.drop svg.icon { width: 74px; height: 74px; color: var(--accent); }
.drop .big { font-family: var(--display); font-size: 30px; font-weight: 380; margin: 14px 0 6px; letter-spacing: -.01em; }
.drop .small { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .03em; background: var(--ink); color: var(--paper); border: 0; padding: 12px 20px; border-radius: 6px; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn.line:hover { background: var(--ink); color: var(--paper); }
.drop .btn { margin-top: 24px; }
.or { display: flex; align-items: center; gap: 14px; margin: 26px 0 0; font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--rule-2); }
.pastebtn { background: none; border: 0; color: var(--accent); font-family: var(--read); font-style: italic; font-size: 18px; cursor: pointer; margin-top: 10px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.paste { margin-top: 18px; text-align: left; }
.paste textarea { width: 100%; min-height: 190px; resize: vertical; font-family: var(--read); font-size: 17px; line-height: 1.6; color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule-2); border-radius: 4px; padding: 14px 16px; outline: none; }
.paste textarea:focus { border-color: var(--accent); }
.paste .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; flex-wrap: wrap; }
.msg { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 14px; }
.msg.err { color: var(--bad); }
.banner { font-family: var(--mono); font-size: 12.5px; padding: 12px 16px; border: 1.5px dashed var(--bad); color: var(--ink); background: var(--paper); margin-bottom: 30px; line-height: 1.6; border-radius: 4px; }

.how { margin: 110px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; }
.how::before { content: ""; position: absolute; left: 8%; right: 8%; top: 34px; border-top: 2px dashed var(--rule-2); }
.step { position: relative; text-align: center; padding: 0 22px; }
.step .ic { width: 68px; height: 68px; margin: 0 auto; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; position: relative; }
.step .ic svg { width: 34px; height: 34px; color: var(--accent); }
.step .n { position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 11px; display: grid; place-items: center; }
.step h3 { font-family: var(--display); font-weight: 420; font-size: 22px; margin: 18px 0 6px; letter-spacing: -.01em; }
.step p { margin: 0 auto; color: var(--muted); font-size: 16.5px; line-height: 1.5; max-width: 30ch; }

.drafts { margin-top: 110px; }
.drafts h2 { font-family: var(--display); font-weight: 380; font-size: 30px; margin: 0 0 18px; letter-spacing: -.015em; }
.ledger { background: var(--paper); border-radius: 4px; box-shadow: var(--shadow); }
.row-d { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 18px; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--rule); text-decoration: none; }
.row-d:last-child { border-bottom: 0; }
.row-d:hover { background: var(--paper-2); }
.row-d .ico { width: 34px; height: 42px; border: 1.5px solid var(--ink); border-radius: 2px 9px 2px 2px; position: relative; }
.row-d .ico::after { content: ""; position: absolute; left: 6px; right: 6px; top: 12px; height: 14px; background: repeating-linear-gradient(var(--rule-2) 0 1.5px, transparent 1.5px 5px); }
.row-d .nm { font-size: 19px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-d .sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ready { color: var(--ok); } .pill.error { color: var(--bad); } .pill.work { color: var(--accent); }
.when { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.empty { font-style: italic; color: var(--muted); font-size: 18px; padding: 26px 22px; }
.fine { margin-top: 70px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); line-height: 1.7; max-width: 90ch; }

/* ---------- editor ---------- */
.bar2 { position: sticky; top: 55px; z-index: 15; background: var(--desk); border-bottom: 1px solid var(--rule); }
.bar2-in { max-width: 1480px; margin: 0 auto; padding: 10px 28px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.docname { font-family: var(--display); font-size: 20px; font-weight: 400; letter-spacing: -.01em; max-width: 36ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: auto; }
.meter { display: flex; gap: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.meter b { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 11px; font-family: var(--mono); font-size: 11.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.bar2 .btn { padding: 8px 13px; font-size: 12px; }

.desk { max-width: 1480px; margin: 0 auto; padding: 28px 28px 120px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, .95fr); gap: 30px; align-items: start; }
.manuscript { background: var(--paper); box-shadow: var(--shadow); border-radius: 3px; padding: 64px clamp(28px, 6vw, 84px) 80px; min-height: 70vh; }
.manuscript h2.ttl { font-family: var(--display); font-weight: 380; font-size: 34px; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 30px; }
.manuscript .hd { font-family: var(--display); font-weight: 500; font-size: 22px; letter-spacing: -.01em; margin: 34px 0 10px; }
.manuscript p.para { font-size: 19px; line-height: 1.78; margin: 0 0 18px; font-weight: 360; }
.manuscript p.refs { font-size: 15px; color: var(--muted); line-height: 1.55; margin: 0 0 8px; }
.s { border-radius: 2px; transition: background .15s, box-shadow .15s; }
.s.claim { background: linear-gradient(transparent 52%, var(--hi) 52%, var(--hi) 94%, transparent 94%); cursor: pointer; }
.s.claim.rel-only { background: linear-gradient(transparent 52%, var(--hi-soft) 52%, var(--hi-soft) 94%, transparent 94%); }
.s.nosrc { text-decoration: underline dotted var(--faint); text-underline-offset: 5px; cursor: pointer; }
.s.waiting { text-decoration: underline dashed var(--rule-2); text-underline-offset: 5px; }
.s.plain:hover { background: var(--hi-soft); cursor: pointer; }
.s.cited { background: linear-gradient(transparent 8%, var(--hi) 8%, var(--hi) 94%, transparent 94%); }
.s.sel { background: var(--hi-sel) !important; box-shadow: 0 0 0 3px var(--hi-sel); color: #1d1b17; }
.mk { font-family: var(--mono); font-size: .66em; font-weight: 600; color: var(--accent); vertical-align: .32em; margin-left: 1px; letter-spacing: -.02em; }
.refblock { margin-top: 44px; padding-top: 18px; border-top: 1.5px solid var(--ink); }
.refblock h3 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 0 0 14px; }
.refblock ol { list-style: none; padding: 0; margin: 0; }
.refblock li { font-size: 15.5px; line-height: 1.55; padding-left: 2.2em; text-indent: -2.2em; margin-bottom: 9px; overflow-wrap: anywhere; }

/* progress clipboard */
.clip { position: relative; background: var(--paper); box-shadow: var(--shadow); border-radius: 6px; padding: 38px 30px 26px; margin-bottom: 26px; }
.clip::before { content: ""; position: absolute; top: -12px; left: 50%; width: 96px; height: 24px; margin-left: -48px; border-radius: 6px 6px 3px 3px; background: linear-gradient(#bdbdbd, #8d8d8d); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.clip .now { font-family: var(--display); font-size: 25px; font-weight: 400; letter-spacing: -.01em; margin: 0 0 4px; }
.clip .eta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.track { height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; margin: 18px 0 24px; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
.steps { list-style: none; margin: 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: var(--rule-2); }
.steps li { position: relative; display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start; padding: 8px 0; }
.steps .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--paper); border: 2px solid var(--rule-2); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; z-index: 1; }
.steps li.done .dot { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.steps li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: ping 1.6s infinite; }
.steps li.now .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(36,67,163,.45); } 80%, 100% { box-shadow: 0 0 0 12px rgba(36,67,163,0); } }
.steps .t { font-size: 17px; line-height: 1.35; }
.steps li.todo .t { color: var(--faint); }
.steps .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.steps .r { font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 6px; white-space: nowrap; }
.clip .err { color: var(--bad); font-family: var(--mono); font-size: 12.5px; line-height: 1.6; margin-top: 14px; }

/* sources pane: the card catalog */
.pane { position: sticky; top: 118px; max-height: calc(100vh - 136px); overflow-y: auto; padding: 2px 6px 30px 2px; scrollbar-width: thin; }
.pane .head { margin-bottom: 18px; }
.lab { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.quote { font-family: var(--read); font-style: italic; font-size: 19px; line-height: 1.5; margin: 8px 0 10px; padding-left: 16px; border-left: 3px solid var(--hi-sel); font-weight: 360; }
.claimline { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.nav { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.nav button { background: none; border: 1px solid var(--rule-2); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.nav button:hover:not(:disabled) { border-color: var(--ink); }
.nav button:disabled { opacity: .35; cursor: default; }
.card {
  position: relative; background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); margin-bottom: 16px; padding: 22px 22px 18px;
  background-image: linear-gradient(var(--card-rule), var(--card-rule)), repeating-linear-gradient(transparent 0 27px, var(--card-line) 27px 28px);
  background-size: 100% 2px, 100% 100%; background-position: 0 40px, 0 40px; background-repeat: no-repeat, repeat;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-1px) rotate(-.15deg); }
.card.on { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.card .top-r { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); height: 18px; }
.stamp { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; padding: 2px 7px; border: 1.5px solid currentColor; border-radius: 3px; transform: rotate(-2deg); }
.stamp.supports { color: var(--ok); } .stamp.related { color: var(--rel); }
.card h4 { font-family: var(--display); font-weight: 450; font-size: 19px; line-height: 1.28; margin: 22px 0 6px; letter-spacing: -.005em; }
.card h4 a { text-decoration: none; }
.card h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.card .by { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.card .why { font-size: 16px; line-height: 1.5; margin: 12px 0 0; }
.card blockquote { margin: 12px 0 0; padding: 8px 12px; background: var(--hi-soft); font-size: 15px; line-height: 1.5; font-style: italic; border-radius: 2px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
.card .found { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.tick { display: inline-flex; align-items: center; gap: 9px; background: none; border: 1.5px solid var(--ink); border-radius: 6px; padding: 7px 12px 7px 9px; cursor: pointer; font-family: var(--mono); font-size: 12px; font-weight: 600; }
.tick .box { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 3px; display: grid; place-items: center; }
.tick:hover { background: var(--ink); color: var(--paper); }
.tick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tick.on .box::after { content: "✓"; font-size: 14px; line-height: 1; }
.hole { position: absolute; bottom: 8px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--desk); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
.none { background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); padding: 24px; font-size: 17px; line-height: 1.5; color: var(--muted); }
.none p { margin: 0 0 14px; }
.legend { display: grid; gap: 12px; margin: 16px 0 24px; font-size: 16px; }
.legend span.sw { display: inline-block; width: 46px; margin-right: 10px; vertical-align: middle; }
.overview { background: var(--paper); border-radius: 3px; box-shadow: var(--shadow); padding: 22px; }
.overview h3 { font-family: var(--display); font-weight: 450; font-size: 21px; margin: 0 0 6px; }
.ov-row { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; line-height: 1.4; }
.ov-row .n { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; padding-top: 2px; }
.more { background: none; border: 0; color: var(--accent); font-family: var(--mono); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.sheet-close { display: none; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 12.5px; padding: 11px 18px; border-radius: 6px; opacity: 0; transition: all .25s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; gap: 36px; }
  .how { grid-template-columns: 1fr; gap: 34px; }
  .how::before { display: none; }
  .desk { grid-template-columns: 1fr; }
  .pane { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 74vh; background: var(--desk); padding: 18px 16px 30px; border-top: 1.5px solid var(--ink); border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform .25s; z-index: 30; box-shadow: 0 -10px 30px rgba(0,0,0,.2); }
  .pane.open { transform: none; }
  .sheet-close { display: inline-block; float: right; }
  .bar2 { top: 55px; }
}
@media (max-width: 640px) {
  .top-in, .bar2-in { padding-left: 16px; padding-right: 16px; }
  .home { padding: 36px 16px 80px; }
  .desk { padding: 16px 12px 100px; }
  .manuscript { padding: 34px 20px 50px; }
  .manuscript p.para { font-size: 18px; }
  .row-d { grid-template-columns: 34px 1fr; }
  .row-d .when, .row-d .pill { grid-column: 2; justify-self: start; }
  .meter { display: none; }
  .drop { padding: 34px 20px 26px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/" aria-label="PaperRepro home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7.5c3-1.6 6.6-1.6 10 .5v18c-3.4-2.1-7-2.1-10-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M27 7.5c-3-1.6-6.6-1.6-10 .5v18c3.4-2.1 7-2.1 10-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 12.5h-1.5v8H20M24 12.5h1.5v8H24" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M22 14.5v4" stroke="var(--accent)" stroke-width="1.6"/></svg>
    <b>PaperRepro</b>
  </a>
  <a class="link" href="/#drafts">my drafts</a>
  <button class="ghost" id="theme" type="button" aria-label="Switch light or dark">◐ theme</button>
</div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script id="app-data" type="application/json">/*__APP_DATA__*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("app-data").textContent);
  var main = document.getElementById("main");
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent, text) {
    var n = tag.indexOf("svg:") === 0 ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
    for (var k in (attrs || {})) if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  function svgIcon(parent, paths, cls) {
    var s = el("svg:svg", { viewBox: "0 0 24 24", class: cls || "", "aria-hidden": "true", fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
    paths.forEach(function (d) { el("svg:path", { d: d }, s); });
    return s;
  }
  function api(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-PaperRepro": "1" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.error || "request failed"); return x; }); });
  }
  var toastEl = document.getElementById("toast"), toastT;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("on"); }, 2600); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function ago(ts) {
    var s = Date.now() / 1000 - ts;
    if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function mins(s) { return s < 60 ? "under a minute" : "about " + Math.round(s / 60) + " min"; }
  function authorsShort(a) { if (!a || !a.length) return "Unknown authors"; return a.length > 3 ? a.slice(0, 3).join(", ") + " et al." : a.join(", "); }
  var WORKING = { queued: 1, reading: 1, finding_claims: 1, searching: 1, checking: 1 };

  // ================================================================ HOME
  function home() {
    document.title = "PaperRepro: find the sources behind your draft";
    var wrap = el("div", { class: "home" }, main);
    if (D.can_run) el("div", { class: "banner" }, wrap, "Not ready to read drafts: " + D.can_run);
    var hero = el("section", { class: "hero" }, wrap);
    var l = el("div", {}, hero);
    var h1 = el("h1", {}, l);
    h1.appendChild(document.createTextNode("Every claim deserves "));
    el("em", {}, h1, "its source.");
    el("p", { class: "lede" }, l, "Drop in your essay or paper. We read it, search the published literature, and show you which papers back each sentence. Tick the ones you want, and we write the citations for you.");

    var tray = el("div", { class: "tray" }, hero);
    el("div", { class: "sheet s1" }, tray); el("div", { class: "sheet s2" }, tray);
    var drop = el("div", { class: "drop" }, tray);
    svgIcon(drop, ["M7 17.5h-.5a4 4 0 0 1-.6-7.96 6 6 0 0 1 11.7-1.5A4.5 4.5 0 0 1 17.5 17.5H17", "M12 12v8.5", "M9 15l3-3 3 3"], "icon");
    el("div", { class: "big" }, drop, "Drop your draft here");
    el("div", { class: "small" }, drop, "PDF · Word (.docx) · text  —  scanned pages welcome");
    var file = el("input", { type: "file", accept: ".pdf,.docx,.txt,.md,.markdown,.tex", hidden: true, "aria-label": "Choose your draft" }, drop);
    var choose = el("button", { class: "btn", type: "button" }, drop, "Choose a file");
    var msg = el("div", { class: "msg", role: "status" }, drop);
    el("div", { class: "or" }, drop, "or");
    var pb = el("button", { class: "pastebtn", type: "button" }, drop, "paste your text instead");
    var paste = el("div", { class: "paste", hidden: true }, drop);
    var ta = el("textarea", { placeholder: "Paste a few paragraphs (or the whole thing)…", "aria-label": "Your text" }, paste);
    var prow = el("div", { class: "row" }, paste);
    el("span", { class: "small" }, prow, "Stays on this computer, except as noted below.");
    var go = el("button", { class: "btn", type: "button" }, prow, "Find sources");
    if (D.can_run) { choose.disabled = true; go.disabled = true; }

    function busy(t) { msg.className = "msg"; msg.textContent = ""; var s = el("span", { class: "spin" }, msg); msg.appendChild(document.createTextNode("  " + t)); }
    function fail(t) { msg.className = "msg err"; msg.textContent = t; choose.disabled = false; go.disabled = false; }
    function upload(f) {
      if (!f) return;
      if (!/\.(pdf|docx|txt|md|markdown|tex)$/i.test(f.name)) return fail("Use a PDF, a Word file (.docx) or a text file.");
      if (f.size > 25 * 1024 * 1024) return fail("That file is over 25 MB.");
      choose.disabled = true; busy("Uploading " + f.name + "…");
      fetch("/api/upload", { method: "POST", headers: { "X-PaperRepro": "1", "X-Filename": encodeURIComponent(f.name), "Content-Type": "application/octet-stream" }, body: f })
        .then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.error); return x; }); })
        .then(function (x) { location.href = "/d/" + x.id; })
        .catch(function (e) { fail(e.message || "Upload failed."); });
    }
    choose.addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { upload(file.files[0]); });
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { if (!D.can_run) upload(e.dataTransfer.files[0]); });
    pb.addEventListener("click", function () { paste.hidden = !paste.hidden; if (!paste.hidden) ta.focus(); });
    go.addEventListener("click", function () {
      if (ta.value.trim().length < 40) return fail("Paste at least a few sentences.");
      go.disabled = true; busy("Sending…");
      api("/api/paste", { text: ta.value, title: ta.value.trim().split("\n")[0].slice(0, 60) })
        .then(function (x) { location.href = "/d/" + x.id; }).catch(function (e) { fail(e.message); });
    });

    var how = el("section", { class: "how", "aria-label": "How it works" }, wrap);
    [["We read it", "Text comes straight from your file; scanned pages go through OCR, word for word.", ["M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z", "M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"]],
     ["We search and check", "Each claim is searched in OpenAlex's index of published papers, and every match is checked against its abstract.", ["M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z", "M15.5 15.5L21 21", "M8 10.5h5M10.5 8v5"]],
     ["You tick, we cite", "Choose the papers you want. Citations go into your text and the reference list builds itself.", ["M4 12.5l4.5 4.5L20 6.5", "M15 18h6"]]].forEach(function (x, i) {
      var s = el("div", { class: "step" }, how);
      var ic = el("div", { class: "ic" }, s); svgIcon(ic, x[2]); el("span", { class: "n" }, ic, String(i + 1));
      el("h3", {}, s, x[0]); el("p", {}, s, x[1]);
    });

    var dr = el("section", { class: "drafts", id: "drafts" }, wrap);
    el("h2", {}, dr, "Your drafts");
    var led = el("div", { class: "ledger" }, dr);
    function drawDrafts(list) {
      led.textContent = "";
      if (!list.length) { el("div", { class: "empty" }, led, "Nothing here yet. Your first draft will appear here."); return; }
      list.forEach(function (d) {
        var a = el("a", { class: "row-d", href: "/d/" + d.id }, led);
        el("span", { class: "ico", "aria-hidden": "true" }, a);
        var mid = el("div", { style: "min-width:0" }, a);
        el("div", { class: "nm" }, mid, d.title || d.filename);
        el("div", { class: "sub" }, mid, d.status === "ready"
          ? d.with_sources + " of " + d.claims + " claims have sources · " + d.cited + " cited"
          : d.status === "error" ? "stopped" : d.progress);
        var st = d.status === "ready" ? "ready" : d.status === "error" ? "error" : "work";
        el("span", { class: "pill " + st }, a, d.status === "ready" ? "ready" : d.status === "error" ? "error" : "working");
        el("span", { class: "when" }, a, ago(d.created_at));
      });
    }
    drawDrafts(D.drafts || []);
    if ((D.drafts || []).some(function (d) { return d.busy; })) (function tick() {
      setTimeout(function () { fetch("/api/drafts").then(function (r) { return r.json(); }).then(function (x) { drawDrafts(x.drafts); if (x.drafts.some(function (d) { return d.busy; })) tick(); }); }, 3000);
    })();
    el("p", { class: "fine" }, wrap, "What leaves this computer: your draft's text goes to OpenAI to be read and judged. Only short keyword searches (a few words per claim) go to OpenAlex. Every source shown is a real record from that database, with a link; nothing is invented. Verdicts are an assistant's reading of abstracts. Open the paper before you rely on it.");
  }

  // ================================================================ EDITOR
  var P, sel = null, sheet;
  function matchesFor(sid) { return P.matches.filter(function (m) { return m.sentence_id === sid; }); }
  function claimFor(sid) { return P.claims.filter(function (c) { return c.sentence_id === sid; })[0]; }
  function claimOrder() {
    var ids = {}; P.claims.forEach(function (c) { ids[c.sentence_id] = 1; });
    var out = [];
    P.draft.paragraphs.forEach(function (p) { p.sentences.forEach(function (s) { if (ids[s.id]) out.push(s.id); }); });
    return out;
  }
  function checkedIds() { var d = {}; P.matches.forEach(function (m) { d[m.sentence_id] = 1; }); return d; }

  function editor() {
    P = D.project;
    document.title = "PaperRepro: " + (P.draft.title || P.filename);
    var bar = el("div", { class: "bar2" }, main), bi = el("div", { class: "bar2-in" }, bar);
    var desk = el("div", { class: "desk" }, main);
    var left = el("div", {}, desk), pane = el("aside", { class: "pane", "aria-label": "Sources" }, desk);
    sheet = pane;
    function drawAll() { drawBar(bi); drawLeft(left); drawPane(pane); }
    drawAll();
    window.__redraw = drawAll;
    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
      var order = claimOrder(), i = order.indexOf(sel);
      if (e.key === "j" || e.key === "ArrowDown" && e.altKey) { select(order[Math.min(order.length - 1, i + 1)] || order[0]); e.preventDefault(); }
      if (e.key === "k" || e.key === "ArrowUp" && e.altKey) { select(order[Math.max(0, i - 1)] || order[0]); e.preventDefault(); }
      if (e.key === "Escape") select(null);
    });
    poll();
  }
  function select(sid) {
    sel = sid; window.__redraw();
    if (sid) {
      var n = document.querySelector('[data-sid="' + sid + '"]');
      if (n && n.scrollIntoView) n.scrollIntoView({ block: "center", behavior: "smooth" });
      sheet.classList.add("open"); sheet.scrollTop = 0;
    } else sheet.classList.remove("open");
  }
  function refresh(x) { P = x; window.__redraw(); }

  function drawBar(bi) {
    bi.textContent = "";
    el("div", { class: "docname", title: P.filename }, bi, P.draft.title || P.filename);
    var meter = el("div", { class: "meter" }, bi);
    var withSrc = Object.keys(checkedIds()).length, cited = Object.keys(P.chosen).length;
    function m(n, t) { var s = el("span", {}, meter); el("b", {}, s, String(n)); s.appendChild(document.createTextNode(" " + t)); }
    m(P.claims.length, "claims"); m(withSrc, "with sources"); m(cited, "cited");
    var seg = el("div", { class: "seg", role: "group", "aria-label": "Citation style" }, bi);
    ["numbered", "ieee", "apa"].forEach(function (s) {
      var b = el("button", { type: "button", "aria-pressed": P.style === s ? "true" : "false" }, seg, P.style_names[s]);
      b.addEventListener("click", function () { if (P.style === s) return; api("/api/d/" + P.id + "/style", { style: s }).then(refresh).catch(function (e) { toast(e.message); }); });
    });
    var copy = el("button", { class: "btn line", type: "button" }, bi, "Copy text");
    copy.addEventListener("click", function () {
      fetch("/api/d/" + P.id + "/export.txt").then(function (r) { return r.text(); }).then(function (t) {
        return navigator.clipboard.writeText(t).then(function () { toast("Copied, with " + P.references.length + " reference" + (P.references.length === 1 ? "" : "s")); });
      }).catch(function () { toast("Could not copy. Use Download instead."); });
    });
    el("a", { class: "btn", href: "/api/d/" + P.id + "/export.docx" }, bi, "Download .docx");
  }

  function drawLeft(left) {
    left.textContent = "";
    if (WORKING[P.status] || P.status === "error" || P.busy) progress(left);
    var ms = el("article", { class: "manuscript" }, left);
    if (!P.draft.paragraphs.length) { el("p", { class: "para", style: "color:var(--faint);font-style:italic" }, ms, "Your draft will appear here as soon as it has been read."); return; }
    var checked = checkedIds(), claims = {};
    P.claims.forEach(function (c) { claims[c.sentence_id] = 1; });
    var firstHeading = true;
    P.draft.paragraphs.forEach(function (p) {
      if (p.kind === "heading") {
        var t = p.sentences[0].text;
        el(firstHeading && t === P.draft.title ? "h2" : "div", { class: firstHeading && t === P.draft.title ? "ttl" : "hd" }, ms, t);
        firstHeading = false; return;
      }
      firstHeading = false;
      var para = el("p", { class: p.kind === "references" ? "refs" : "para" }, ms);
      p.sentences.forEach(function (s, i) {
        if (i) para.appendChild(document.createTextNode(" "));
        var ms_ = matchesFor(s.id), cls = "s";
        if (p.kind === "references") { para.appendChild(document.createTextNode(s.text)); return; }
        if (P.chosen[s.id]) cls += " cited claim";
        else if (ms_.length) cls += " claim" + (ms_.some(function (m) { return m.verdict === "supports"; }) ? "" : " rel-only");
        else if (claims[s.id]) cls += checked[s.id] || P.status === "ready" ? " nosrc" : " waiting";
        else cls += " plain";
        if (sel === s.id) cls += " sel";
        var span = el("span", { class: cls, "data-sid": s.id, tabindex: claims[s.id] ? "0" : null, role: "button",
                                 "aria-label": ms_.length ? ms_.length + " sources found. " + s.text : null }, para);
        var mk = P.markers[s.id];
        var m = mk ? s.text.match(/([.!?;:]+["'”’)\]]*)\s*$/) : null;
        if (mk && m) {
          span.appendChild(document.createTextNode(s.text.slice(0, m.index)));
          el("span", { class: "mk" }, span, (P.style === "apa" ? " " : "") + mk);
          span.appendChild(document.createTextNode(m[1]));
        } else {
          span.appendChild(document.createTextNode(s.text));
          if (mk) el("span", { class: "mk" }, span, " " + mk);
        }
        span.addEventListener("click", function () { select(sel === s.id ? null : s.id); });
        span.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(s.id); } });
      });
    });
    if (P.references.length) {
      var rb = el("section", { class: "refblock" }, ms);
      el("h3", {}, rb, P.draft.paragraphs.some(function (p) { return p.kind === "references"; }) ? "Added references" : "References");
      var ol = el("ol", {}, rb);
      P.references.forEach(function (r) { el("li", {}, ol, r); });
    }
  }

  var startedChecking = null;
  function progress(left) {
    var clip = el("section", { class: "clip", "aria-live": "polite" }, left);
    var order = ["reading", "finding_claims", "searching", "ready"];
    var stage = P.status === "checking" ? "searching" : P.status === "queued" ? "reading" : P.status;
    var idx = P.status === "error" ? -1 : order.indexOf(stage);
    var total = P.claims.length, done = Object.keys(checkedIds()).length;
    var findBusy = P.busy && P.busy.indexOf("find:") === 0;
    var head = P.status === "error" ? "Something went wrong" : findBusy ? "Searching for one more sentence" :
      stage === "reading" ? "Reading your draft" : stage === "finding_claims" ? "Finding the sentences that need sources" :
      stage === "searching" ? "Searching and checking sources" : "Ready";
    el("p", { class: "now" }, clip, head);
    var eta = el("div", { class: "eta" }, clip);
    if (stage === "searching" && total) {
      if (!startedChecking) startedChecking = { t: Date.now(), d: done };
      var rate = (Date.now() - startedChecking.t) / 1000 / Math.max(1, done - startedChecking.d);
      var left_ = done > startedChecking.d ? rate * (total - done) : total * 7 / 4;
      eta.textContent = done + " of " + total + " sentences checked · " + mins(left_) + " left";
    } else if (P.status === "error") eta.textContent = "";
    else eta.textContent = P.progress || "Starting…";
    var pct = P.status === "error" ? 0 : stage === "reading" ? 8 : stage === "finding_claims" ? 20 : stage === "searching" ? 22 + 76 * (total ? done / total : 0) : 100;
    var tr = el("div", { class: "track", role: "progressbar", "aria-valuenow": Math.round(pct), "aria-valuemin": 0, "aria-valuemax": 100 }, clip);
    el("i", { style: "width:" + pct + "%" }, tr);
    var steps = el("ol", { class: "steps" }, clip);
    [["Read the draft", "text layer first; OCR for scanned pages", P.draft.ocr_pages.length ? P.draft.ocr_pages.length + " page(s) by OCR" : ""],
     ["Find sentences that need a source", "facts, findings and prior work, not your own results", total ? total + " found" : ""],
     ["Search the literature and check each match", "OpenAlex index; abstracts read and judged", total ? done + " / " + total : ""],
     ["Ready to cite", "tick the papers you want", ""]].forEach(function (x, i) {
      var cls = idx < 0 ? "todo" : i < idx ? "done" : i === idx ? (stage === "ready" ? "done" : "now") : "todo";
      var li = el("li", { class: cls }, steps);
      el("span", { class: "dot" }, li, cls === "done" ? "✓" : cls === "now" ? "" : String(i + 1));
      var mid = el("div", {}, li); el("div", { class: "t" }, mid, x[0]); el("div", { class: "d" }, mid, x[1]);
      el("span", { class: "r" }, li, x[2]);
    });
    if (P.status === "error") el("div", { class: "err" }, clip, P.error);
  }

  function drawPane(pane) {
    var keep = pane.scrollTop;
    pane.textContent = "";
    var x = el("button", { class: "ghost sheet-close", type: "button" }, pane, "close ✕");
    x.addEventListener("click", function () { select(null); });
    if (!sel) return overview(pane);
    var sentence = null;
    P.draft.paragraphs.forEach(function (p) { p.sentences.forEach(function (s) { if (s.id === sel) sentence = s; }); });
    if (!sentence) return overview(pane);
    var order = claimOrder(), i = order.indexOf(sel), c = claimFor(sel), ms = matchesFor(sel);
    var head = el("div", { class: "head" }, pane);
    el("div", { class: "lab" }, head, c ? "Sources for this sentence" : "This sentence");
    el("div", { class: "quote" }, head, sentence.text);
    if (c) el("div", { class: "claimline" }, head, "claim: " + c.claim + "   ·   searched: " + c.queries.join(" / "));
    if (i >= 0) {
      var nav = el("div", { class: "nav" }, head);
      var pv = el("button", { type: "button", disabled: i <= 0 }, nav, "‹ prev"); pv.addEventListener("click", function () { select(order[i - 1]); });
      el("span", {}, nav, (i + 1) + " / " + order.length);
      var nx = el("button", { type: "button", disabled: i >= order.length - 1 }, nav, "next ›"); nx.addEventListener("click", function () { select(order[i + 1]); });
      el("span", { style: "margin-left:auto;color:var(--faint)" }, nav, "j / k");
    }
    var busyHere = P.busy === "find:" + sel;
    if (!ms.length) {
      var none = el("div", { class: "none" }, pane);
      if (busyHere) { var pp = el("p", {}, none); el("span", { class: "spin" }, pp); pp.appendChild(document.createTextNode("  Searching the literature for this sentence…")); }
      else if (WORKING[P.status] && c) el("p", {}, none, "Still searching for this one.");
      else {
        el("p", {}, none, c ? "No published paper we found clearly backs this sentence. That can mean it is your own point, or the wording is unusual." :
          "This sentence was not flagged as needing a source.");
        var b = el("button", { class: "btn line", type: "button", disabled: !!P.busy || WORKING[P.status] }, none, c ? "Search again" : "Find sources anyway");
        b.addEventListener("click", function () { b.disabled = true; api("/api/d/" + P.id + "/find", { sentence_id: sel }).then(function (x) { refresh(x); poll(); }).catch(function (e) { toast(e.message); b.disabled = false; }); });
      }
      return;
    }
    var chosen = P.chosen[sel] || [];
    ms.forEach(function (m) {
      var s = P.sources[m.source_id]; if (!s) return;
      var on = chosen.indexOf(s.id) >= 0;
      var card = el("article", { class: "card" + (on ? " on" : "") }, pane);
      var tr = el("div", { class: "top-r" }, card);
      el("span", { class: "stamp " + m.verdict }, tr, m.verdict === "supports" ? "SUPPORTS" : "RELATED");
      el("span", {}, tr, String(s.year || "n.d."));
      if (s.cited_by != null) el("span", {}, tr, "cited " + s.cited_by.toLocaleString() + "×");
      var h = el("h4", {}, card), u = safeUrl(s.url);
      if (u) el("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, h, s.title); else h.textContent = s.title;
      el("div", { class: "by" }, card, authorsShort(s.authors) + (s.venue ? "  ·  " + s.venue : ""));
      el("p", { class: "why" }, card, m.reason);
      if (m.evidence) el("blockquote", {}, card, "“" + m.evidence + "”");
      var f = el("div", { class: "foot" }, card);
      el("span", { class: "found" }, f, s.doi ? "doi:" + s.doi : (s.found_by || []).join(" + "));
      var t = el("button", { class: "tick" + (on ? " on" : ""), type: "button", "aria-pressed": on ? "true" : "false" }, f);
      el("span", { class: "box", "aria-hidden": "true" }, t);
      t.appendChild(document.createTextNode(on ? "Cited " + (P.style === "apa" ? "" : "[" + P.numbers[s.id] + "]") : "Cite this"));
      t.addEventListener("click", function () {
        var now = !on;
        var cur = (P.chosen[sel] || []).filter(function (x) { return x !== s.id; });
        P.chosen[sel] = now ? cur.concat([s.id]) : cur;  // optimistic; the server renders markers
        window.__redraw();
        api("/api/d/" + P.id + "/choose", { sentence_id: sel, source_id: s.id, on: now }).then(refresh)
          .catch(function (e) { toast(e.message); });
      });
      el("span", { class: "hole", "aria-hidden": "true" }, card);
    });
    var again = el("button", { class: "more", type: "button", disabled: !!P.busy || WORKING[P.status], style: "margin:6px 0 0" }, pane, busyHere ? "searching…" : "Not right? Search again for this sentence");
    again.addEventListener("click", function () { api("/api/d/" + P.id + "/find", { sentence_id: sel }).then(function (x) { refresh(x); poll(); }).catch(function (e) { toast(e.message); }); });
    pane.scrollTop = keep;
  }

  function overview(pane) {
    var head = el("div", { class: "head" }, pane);
    el("div", { class: "lab" }, head, "How to read the highlights");
    var lg = el("div", { class: "legend" }, pane);
    [["linear-gradient(transparent 50%, var(--hi) 50%, var(--hi) 94%, transparent 94%)", "sources found, at least one directly supports it"],
     ["linear-gradient(transparent 50%, var(--hi-soft) 50%, var(--hi-soft) 94%, transparent 94%)", "only related papers found"],
     ["none;text-decoration:underline dotted var(--faint);text-underline-offset:5px", "needs a source, none found yet"]].forEach(function (x) {
      var r = el("div", {}, lg);
      var sw = el("span", { class: "sw", style: "background:" + x[0] }, r, "text");
      sw.style.color = "transparent"; if (x[0].indexOf("none") === 0) { sw.style.background = "none"; sw.style.color = "var(--ink)"; sw.textContent = "text"; }
      r.appendChild(document.createTextNode(x[1]));
    });
    el("p", { style: "font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 26px" }, pane,
       "Click a highlighted sentence to see its sources, or any other sentence to search for one. Keys: j and k move between claims.");
    var ov = el("div", { class: "overview" }, pane);
    el("h3", {}, ov, P.references.length ? "Your references so far" : "No sources cited yet");
    if (!P.references.length) el("p", { style: "margin:4px 0 0;color:var(--muted);font-size:15.5px" }, ov, "Tick “Cite this” on a source card and it appears here, numbered in the order it shows up in your text.");
    P.references.forEach(function (r) {
      var row = el("div", { class: "ov-row" }, ov);
      var mm = r.match(/^\[(\d+)\]\s*(.*)$/);
      el("span", { class: "n" }, row, mm ? mm[1] : "•"); el("span", {}, row, mm ? mm[2] : r);
    });
  }

  var pollT;
  function poll() {
    clearTimeout(pollT);
    if (!(WORKING[P.status] || P.busy)) return;
    pollT = setTimeout(function () {
      fetch("/api/d/" + P.id).then(function (r) { return r.json(); }).then(function (x) {
        var changed = JSON.stringify([x.status, x.progress, x.matches.length, x.claims.length, x.busy, x.draft.paragraphs.length]) !==
                      JSON.stringify([P.status, P.progress, P.matches.length, P.claims.length, P.busy, P.draft.paragraphs.length]);
        P = x; if (changed) window.__redraw();
        poll();
      }).catch(poll);
    }, 2000);
  }

  ({ home: home, editor: editor }[D.page] || home)();

  var th = document.getElementById("theme");
  try { var saved = localStorage.getItem("pr-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch (e) {}
  th.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("pr-theme", next); } catch (e) {}
  });
})();
</script>
</body>
</html>
