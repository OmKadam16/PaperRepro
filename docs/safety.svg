<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" font-family="Helvetica, Arial, sans-serif">
  <title>Built-in limits: keys stay on the server, text-only chat, 15 calls a day</title>
  <rect width="1200" height="270" rx="22" fill="#1d1b17"/>
  <g fill="#f3eee2">
    <!-- keys -->
    <g transform="translate(60 52)">
      <rect width="340" height="170" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="44" cy="46" r="15" fill="none" stroke="#8fa8ff" stroke-width="2.4"/>
      <path d="M59 46h34M83 46v10M91 46v7" stroke="#8fa8ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="96" font-size="17" font-weight="bold">Keys stay on the server</text>
      <text x="26" y="122" font-size="13" fill-opacity=".7">Nothing secret reaches the browser,</text>
      <text x="26" y="142" font-size="13" fill-opacity=".7">and .env can't be fetched.</text>
    </g>
    <!-- text only -->
    <g transform="translate(430 52)">
      <rect width="340" height="170" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
      <path d="M26 30h64v38H48l-14 12V68h-8z" fill="none" stroke="#6fd39a" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M38 44h40M38 54h26" stroke="#6fd39a" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="100" font-size="17" font-weight="bold">Text-only chat</text>
      <text x="26" y="126" font-size="13" fill-opacity=".7">Requests for code, and tricks to get</text>
      <text x="26" y="146" font-size="13" fill-opacity=".7">keys or instructions, are refused.</text>
    </g>
    <!-- quota -->
    <g transform="translate(800 52)">
      <rect width="340" height="170" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
      <g transform="translate(26 30)">
        <rect x="0" y="0" width="12" height="40" rx="3" fill="#e8b74a"/>
        <rect x="17" y="0" width="12" height="40" rx="3" fill="#e8b74a"/>
        <rect x="34" y="0" width="12" height="40" rx="3" fill="#e8b74a"/>
        <rect x="51" y="0" width="12" height="40" rx="3" fill="#e8b74a" fill-opacity=".35"/>
        <rect x="68" y="0" width="12" height="40" rx="3" fill="#e8b74a" fill-opacity=".35"/>
      </g>
      <text x="26" y="100" font-size="17" font-weight="bold">15 AI calls a day</text>
      <text x="26" y="126" font-size="13" fill-opacity=".7">Each action is one call. Resets at</text>
      <text x="26" y="146" font-size="13" fill-opacity=".7">midnight UTC.</text>
    </g>
  </g>
</svg>
