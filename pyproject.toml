[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrepro"
version = "0.2.0"
description = "Find the published sources behind every claim in your draft"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
openai = ["openai>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
paperrepro = "paperrepro.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperrepro = ["*.html"]

[tool.ruff]
line-length = 100
extend-exclude = ["runs"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
